# dsh-hduhelp-ai profile patch — insert one host entry. The browser half
# (lib/client.js) is picked up by dsh-client-modules through this package's
# `dsh.client` declaration, so the Settings panel appears without extra wiring.
#
# 定位：账号所有者单人使用。插件不监听任何额外端口，模型请求由宿主直连上游。
- insert:
    - id: hduhelp-ai
      name: 'dsh-hduhelp-ai'
      config:
        # 默认用途：app.mate.chat / app.mate.summary / app.mate.title / app.mate.image
        purpose: app.mate.chat
        # token / 勾选集 / 模型缓存目录，留空 = ~/.dsh/hduhelp-ai
        dataDir: ''