name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) needs npm >= 11.5.2
      - name: Ensure modern npm
        run: npm install -g npm@^11

      - name: Check whether this version is already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "dsh-hduhelp-ai@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "dsh-hduhelp-ai@$VERSION is already on npm, skip publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (trusted publishing / OIDC)
        if: steps.check.outputs.published == 'false'
        run: npm publish --access public --provenance
